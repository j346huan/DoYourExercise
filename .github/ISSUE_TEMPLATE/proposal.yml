name: Suggest an exercise or book
description: Propose an addition to the notebook.
body:
  - type: dropdown
    id: kind
    attributes:
      label: Proposal type
      options:
        - Unlisted exercise
        - New book
        - Correction
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Book and exercise reference
      description: Include the author, year, edition, chapter, section, and problem number where applicable.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the addition or correction and include source references.
    validations:
      required: true
